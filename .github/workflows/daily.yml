name: Scrape KTC
on:
  schedule:
    - cron: '0 8 * * *'   # svaki dan u 8:00 UTC (10:00 hrvatsko ljetno vrijeme)
  workflow_dispatch:       # omogućuje ručno pokretanje

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scraper
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_CREDENTIALS" > serviceAccountKey.json
          echo "Veličina serviceAccountKey.json: $(wc -c < serviceAccountKey.json) bajtova"
          echo "Prvi znak (treba biti '{'): $(head -c 1 serviceAccountKey.json)"
          python scraper.py 2>&1 | tee run.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            *.log
            *.txt
